<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  <!-- Inner subtle border glow -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" />
  <!-- Modern Geometric Three-Blade Pinwheel Mark -->
  <g transform="translate(32,32)">
    <rect x="0" y="-3.5" width="24" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="0" y="-3.5" width="24" height="7" rx="3.5" fill="#FFFFFF" transform="rotate(120)"/>
    <rect x="0" y="-3.5" width="24" height="7" rx="3.5" fill="#FFFFFF" transform="rotate(240)"/>
  </g>
</svg>
